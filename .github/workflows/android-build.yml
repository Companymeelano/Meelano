name: Build MeeLano Tunnel APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # The Xray core is a 59 MB prebuilt AAR. Committing it would blow past
      # sensible repository limits, so it is fetched at build time and pinned to
      # an exact tag for reproducibility.
      - name: Fetch Xray core (libv2ray.aar)
        run: |
          set -euo pipefail
          mkdir -p app/libs
          VER="v26.8.20"
          URL="https://github.com/2dust/AndroidLibXrayLite/releases/download/${VER}/libv2ray.aar"
          echo "Downloading Xray core ${VER}"
          curl -fsSL --retry 4 --retry-delay 5 -o app/libs/libv2ray.aar "$URL"
          SIZE=$(stat -c%s app/libs/libv2ray.aar)
          echo "libv2ray.aar = ${SIZE} bytes"
          # A truncated or HTML error page would otherwise fail much later with a
          # confusing Kotlin error, so verify it is a real, plausibly sized zip.
          if [ "$SIZE" -lt 10000000 ]; then
            echo "::error::libv2ray.aar is implausibly small (${SIZE} bytes)"
            exit 1
          fi
          unzip -l app/libs/libv2ray.aar | head -5

          # Routing rules such as geoip:private silently match nothing without
          # these, which would push LAN traffic through the tunnel.
          mkdir -p app/src/main/assets
          for f in geoip.dat geosite.dat; do
            curl -fsSL --retry 4 --retry-delay 5 \
              -o "app/src/main/assets/$f" \
              "https://raw.githubusercontent.com/2dust/AndroidLibXrayLite/master/assets/$f"
            echo "$f = $(stat -c%s app/src/main/assets/$f) bytes"
          done

      - name: Generate Gradle wrapper (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1
          fi

      - name: Unit tests
        id: tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee /tmp/build.log

      - name: Report build output
        if: always()
        run: |
          grep -E "^e: |error:|FAILED|Unresolved|AssertionError|Caused by|at com.example|expected:" /tmp/build.log \
            | head -60 \
            | while IFS= read -r line; do
                clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
                echo "::error::$clean"
              done
          {
            echo '### Build output'
            echo '```'
            tail -120 /tmp/build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release APK
        continue-on-error: true
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace 2>&1 | tee -a /tmp/build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meelano-tunnel-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: meelano-tunnel-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Rename APKs for distribution
        run: |
          mkdir -p dist
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/*.apk    "dist/MeeLano-Tunnel-v${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/*.apk  "dist/MeeLano-Tunnel-v${VERSION}-release.apk" 2>/dev/null || true
          cd dist && sha256sum *.apk > SHA256SUMS.txt && ls -la

      - name: Publish GitHub Release with installable APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build${{ github.run_number }}
          name: MeeLano Tunnel v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          body: |
            ## MeeLano Tunnel v${{ env.APP_VERSION }}

            نسخهٔ نهایی و قابل نصب روی اندروید.

            **دانلود و نصب:** فایل `MeeLano-Tunnel-v${{ env.APP_VERSION }}-release.apk` را
            روی گوشی دانلود کنید، «نصب از منابع ناشناس» را برای مرورگر فعال کنید و نصب کنید.
            هنگام اولین اتصال، اندروید مجوز VPN می‌خواهد — تأیید کنید.

            | فایل | توضیح |
            |---|---|
            | `…-release.apk` | نسخهٔ اصلی برای نصب روی گوشی |
            | `…-debug.apk` | نسخهٔ توسعه (قابل نصب همزمان، پسوند بستهٔ `.debug`) |
            | `SHA256SUMS.txt` | جمع کنترلی برای بررسی صحت فایل |

            پین‌کد پیش‌فرض قفل برنامه: **1234**

            Commit: ${{ github.sha }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
          if-no-files-found: ignore
