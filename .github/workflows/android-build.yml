name: Build MeeLano Tunnel APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Generate Gradle wrapper (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1
          fi

      - name: Unit tests
        id: tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee /tmp/build.log

      - name: Report build output
        if: always()
        run: |
          grep -E "^e: |error:|FAILED|Unresolved|AssertionError|Caused by|at com.example|expected:" /tmp/build.log \
            | head -60 \
            | while IFS= read -r line; do
                clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
                echo "::error::$clean"
              done
          {
            echo '### Build output'
            echo '```'
            tail -120 /tmp/build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release APK
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meelano-tunnel-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: meelano-tunnel-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
          if-no-files-found: ignore
